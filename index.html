<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiko Chart Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- JSZip (ZIPの読み書き用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <header>
        <h1>Taiko Chart Editor</h1>
        <div class="header-actions">
            <button class="btn secondary" id="selectAudioBtn" onclick="document.getElementById('audioFile').click()">音楽を選択</button>
            <span class="file-name" id="audioFileName">未選択</span>
            <input type="file" id="audioFile" accept="audio/*">
            
            <button class="btn secondary" onclick="document.getElementById('importZip').click()">ZIPを開く</button>
            <input type="file" id="importZip" accept=".zip">
            
            <button class="btn primary" id="downloadBtn">ZIPでダウンロード</button>
        </div>
    </header>

    <main>
        <!-- サイドバー：曲情報・ツールボックス・再生コントロール -->
        <aside class="sidebar">
            <div class="panel">
                <h2>曲情報</h2>
                <div class="input-group">
                    <label>タイトル</label>
                    <input type="text" id="metaTitle" value="sample">
                </div>
                <div class="input-group">
                    <label>初期BPM</label>
                    <input type="number" id="metaBpm" value="120">
                </div>
                <div class="input-group">
                    <label>OFFSET (秒)</label>
                    <input type="number" step="0.001" id="metaOffset" value="0">
                </div>
            </div>

            <div class="panel">
                <h2>ツールボックス</h2>
                <div class="tool-grid">
                    <button class="tool-btn active" data-note="1"><img src="assets/img/Don.png" alt="">ドン</button>
                    <button class="tool-btn" data-note="2"><img src="assets/img/Ka.png" alt="">カッ</button>
                    <button class="tool-btn" data-note="3"><img src="assets/img/Don_2.png" alt="">大ドン</button>
                    <button class="tool-btn" data-note="4"><img src="assets/img/Ka_2.png" alt="">大カッ</button>
                    <button class="tool-btn" data-note="5" style="grid-column: span 2;">連打開始(5)</button>
                    <button class="tool-btn" data-note="8" style="grid-column: span 2;">連打終了(8)</button>
                    <button class="tool-btn" data-note="7" style="grid-column: span 2;">風船(7)</button>
                    <button class="tool-btn delete" data-note="delete">削除</button>
                </div>
            </div>

            <div class="panel">
                <h2>再生コントロール</h2>
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <button class="btn success" id="playBtn" style="flex: 1;">再生 / 停止</button>
                    <button class="btn danger" id="stopBtn">最初から</button>
                </div>
                <div id="currentTimeDisplay" style="font-size: 12px; color: #aaa; text-align: center;">0.00 / 0.00s</div>
                <div class="seek-bar-container">
                    <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
                </div>
            </div>
        </aside>

        <!-- メインエディタ領域 -->
        <section class="editor-container">
            <!-- 難易度タブ -->
            <div class="course-tabs">
                <button class="course-tab" data-course="easy">かんたん</button>
                <button class="course-tab" data-course="normal">ふつう</button>
                <button class="course-tab" data-course="hard">むずかしい</button>
                <button class="course-tab active" data-course="oni">おに</button>
                <button class="course-tab" data-course="edit">裏おに</button>
            </div>

            <!-- エディタ上部コントロールバー -->
            <div class="editor-header">
                <div class="header-controls-left" style="font-size: 14px; color: #aaa;">
                    チップ・小節の編集
                </div>
                <div class="header-controls-right">
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
                        <span>小節移動:</span>
                        <input type="number" id="jumpMeasureInput" value="1" style="width: 50px; background: #1a1a24; border: 1px solid #444; color: #fff; padding: 3px; border-radius: 4px;">
                        <button class="btn secondary" id="jumpMeasureBtn" style="padding: 3px 8px; font-size: 12px;">Go</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 13px;">
                        <span>基本解像度:</span>
                        <select id="subdivisionSelect" style="background: #1a1a24; border: 1px solid #444; color: #fff; padding: 3px; border-radius: 4px;">
                            <option value="4">4分</option>
                            <option value="8">8分</option>
                            <option value="12">12分</option>
                            <option value="16" selected>16分</option>
                            <option value="24">24分</option>
                            <option value="32">32分</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 小節リストが表示されるコンテナ -->
            <div class="measures-container" id="measuresContainer">
                <!-- 動的に小節行が生成されます -->
            </div>
        </section>
    </main>

    <!-- メインスクリプトの読み込み -->
    <script src="js/script.js"></script>
</body>
</html>
